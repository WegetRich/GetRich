<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get Rich or Die Trying</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--ink:#f2f2f2;--mut:#8a8a8a;--card:#111;--line:#262626;--up:#3ddc84;--acc:#3ddc84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;border-bottom:1px solid var(--line);z-index:2}
h1{margin:0 0 8px;font-size:22px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;font:600 15px system-ui,sans-serif}
.tabs button[aria-selected=true]{background:var(--acc);color:#000;border-color:var(--acc)}
.bar{display:flex;justify-content:space-between;font:13px system-ui,sans-serif;color:var(--mut);margin-top:8px}
.bar button{background:none;border:0;color:var(--up);font:600 13px system-ui,sans-serif}
main{padding:12px 16px;max-width:680px;margin:auto}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
article a{color:inherit;text-decoration:none}
article h2{font-size:17px;margin:0 0 6px;line-height:1.3}
.meta{font:12px system-ui,sans-serif;color:var(--mut)}
.msg{text-align:center;color:var(--mut);padding:30px 0;font-family:system-ui,sans-serif}
.tick{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);background:#0a0a0a;font:600 13px system-ui,sans-serif;padding:8px 0}
.tick div{display:inline-block;padding-left:100%;animation:run 40s linear infinite}
.tick:active div{animation-play-state:paused}
.tick span{margin-right:26px}.up{color:var(--up)}.dn{color:#ff5c5c}
@keyframes run{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.tick div{animation:none;padding-left:12px}.tick{overflow-x:auto}}
</style></head><body>
<header><h1>Get Rich or Die Trying</h1>
<div class="tabs" role="tablist">
<button role="tab" data-t="crypto" aria-selected="true">Krypto</button>
<button role="tab" data-t="stocks" aria-selected="false">Aktien</button></div>
<div class="bar"><span id="upd">Lädt …</span><button id="ref">Aktualisieren</button></div></header>
<div class="tick" aria-label="Kurse in US-Dollar"><div id="tk">Kurse laden …</div></div>
<main id="list"></main>
<script>
const RSS={
 crypto:['https://feeds.finance.yahoo.com/rss/2.0/headline?s=BTC-USD,ETH-USD&region=US&lang=en-US','https://news.google.com/rss/search?q=bitcoin+OR+crypto&hl=en-US&gl=US&ceid=US:en','https://www.coindesk.com/arc/outboundfeeds/rss/','https://cointelegraph.com/rss','https://decrypt.co/feed','https://bitcoinmagazine.com/feed'],
 stocks:['https://finance.yahoo.com/news/rssindex','https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664','https://feeds.marketwatch.com/marketwatch/topstories/']
};
async function viaJson(u){const j=await(await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u))).json();if(!j.items||!j.items.length)throw 0;
 return j.items.map(n=>({t:n.title,u:n.link,s:(j.feed&&j.feed.title)||'News',d:Date.parse(String(n.pubDate).replace(' ','T')+'Z')||Date.now()}))}
async function viaProxy(u){const x=await(await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u))).text();
 const d=new DOMParser().parseFromString(x,'text/xml');const nm=new URL(u).hostname.replace('www.','');
 const r=[...d.querySelectorAll('item')].map(i=>({t:i.querySelector('title').textContent,u:i.querySelector('link').textContent,s:nm,d:Date.parse(i.querySelector('pubDate')?.textContent)||Date.now()}));
 if(!r.length)throw 0;return r}
const one=async u=>{try{return await viaJson(u)}catch(e){return await viaProxy(u)}};
async function merge(a,urls){const r=await Promise.allSettled(urls.map(one));r.forEach(x=>{if(x.status==='fulfilled')a.push(...x.value)});return a.sort((p,q)=>q.d-p.d)}
const FEEDS={
 crypto:async()=>{let a=[];try{const j=await(await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN')).json();
  a=j.Data.map(n=>({t:n.title,u:n.url,s:(n.source_info&&n.source_info.name)||n.source,d:n.published_on*1000}))}catch(e){}
  return merge(a,RSS.crypto)},
 stocks:()=>merge([],RSS.stocks)
};
let tab='crypto';const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(silent){
 if(!silent)$('#list').innerHTML='<p class="msg">Lädt …</p>';
 try{const items=(await FEEDS[tab]()).slice(0,40);
  if(!items.length)throw 0;
  localStorage.setItem('n_'+tab,JSON.stringify(items));render(items);
  $('#upd').textContent='Stand '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 }catch(e){const c=localStorage.getItem('n_'+tab);
  if(c){render(JSON.parse(c));$('#upd').textContent='Offline – letzter Stand'}
  else $('#list').innerHTML='<p class="msg">Keine News geladen. Internet prüfen und „Aktualisieren“ tippen.</p>'}
}
function render(a){$('#list').innerHTML=a.map(n=>`<article><a href="${esc(n.u)}" target="_blank" rel="noopener"><h2>${esc(n.t)}</h2><div class="meta">${esc(n.s)} · ${new Date(n.d).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></a></article>`).join('')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));load()});
$('#ref').onclick=()=>load();load();
setInterval(()=>{if(!document.hidden)load(true)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
addEventListener('online',()=>load(true));addEventListener('focus',()=>load(true));

const COINS={bitcoin:'BTC',ethereum:'ETH',solana:'SOL',ripple:'XRP',dogecoin:'DOGE',binancecoin:'BNB'};
const STK=['AAPL','TSLA','NVDA','MSFT','AMZN','META'];
const fmt=n=>'$'+n.toLocaleString('en-US',{maximumFractionDigits:n<1?4:2});
const chip=(n,p,c)=>`<span>${n} ${fmt(p)} <b class="${c>=0?'up':'dn'}">${c>=0?'▲':'▼'}${Math.abs(c).toFixed(2)}%</b></span>`;
async function prices(){
 let out=[];
 try{const j=await(await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+Object.keys(COINS)+'&vs_currencies=usd&include_24hr_change=true')).json();
  out.push(...Object.keys(COINS).filter(k=>j[k]).map(k=>chip(COINS[k],j[k].usd,j[k].usd_24h_change||0)))}catch(e){}
 const st=await Promise.allSettled(STK.map(async t=>{
  const u='https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?interval=1d&range=2d';
  const m=(await(await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u))).json()).chart.result[0].meta;
  return chip(t,m.regularMarketPrice,(m.regularMarketPrice/m.chartPreviousClose-1)*100)}));
 out.push(...st.filter(x=>x.status==='fulfilled').map(x=>x.value));
 if(out.length){const h=out.join('');localStorage.setItem('tk',h);$('#tk').innerHTML=h}
 else{const c=localStorage.getItem('tk');if(c)$('#tk').innerHTML=c}
}
prices();setInterval(()=>{if(!document.hidden)prices()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)prices()});
</script></body></html>
